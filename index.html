<title>Comentarios del curso de alemán para niños</title>

<style>

@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141829;--card:#1d2238;--ink:#eef0fa;--mut:#9aa3c4;--line:#2d3452;--pos:#3cc4ae;--sug:#f2bc2c;--neg:#f0766c;--mix:#8f9aee;--track:#2a3050}}
*{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 Nunito,system-ui,sans-serif}
main{max-width:1060px;margin:0 auto;padding:24px 16px 48px}
h1,h2,.big{font-family:"Baloo 2",system-ui,sans-serif;margin:0}
h1{font-size:clamp(26px,5vw,38px);font-weight:800;line-height:1.1}
h2{font-size:19px;font-weight:600;margin-bottom:12px}
.top{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:end;margin-bottom:20px}
.sub{color:var(--mut);margin:6px 0 0}

select:focus-visible,.row.click:focus-visible{outline:3px solid var(--mix);outline-offset:2px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(12,1fr)}

.big{font-size:40px;font-weight:800;line-height:1}
.lab{color:var(--mut);font-size:13px;margin-top:6px}

.fi{height:100%;border-radius:7px;min-width:2px}
.v{font-weight:800;min-width:58px;text-align:right}
.t{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}

.n{flex:none;font-weight:800;border-radius:8px;padding:0 8px;height:24px;line-height:24px;color:#10162b}
.note{color:var(--mut);font-size:13px;margin-top:10px}

<script>

es con Umlaut (ä, ö, ü) en las primeras lecciones.","La metodología basada en juegos es excelente, pero me gustaría que mandaran un resumen de la clase para repasar en casa.","La transición entre el tema de los saludos y el abecedario fue algo drástica en la segunda semana.","Las actividades interactivas y los juegos dinámicos mantuvieron a mi hija super concentrada y motivada en cada sesión.","Las canciones y videos animados ayudan muchísimo a memorizar el vocabulario sin tener que memorizar de forma aburrida.","Las dinámicas de pronunciación en grupo hicieron que mi hijo perdiera la pena de hablar en alemán desde la primera semana.","Las lecturas cortas del módulo avanzado se sintieron algo complejas para el nivel primaria inicial.","Las tarjetas ilustradas y los juegos de rol para practicar los saludos iniciales hicieron la clase muy amena.","Los módulos coloridos llaman mucho la atención de los niños, solo sugeriría dar más tiempo para los ejercicios de pronunciación.","Me encantan los módulos coloridos y lo visual que es el contenido. Está perfectamente estructurado para la edad de 6 a 10 años.","Me impresionó lo rápido que aprendieron el abecedario y la pronunciación básica. La docente tiene un método increíble.","Mi hijo de 8 años sale feliz de cada clase cantando las rimas. Un método lúdico perfecto para nivel primaria.","Muy buen nivel pedagógico. Mi hijo aprendió los días de la semana y las emociones de forma muy natural y divertida.","Podrían incorporar pequeñas cápsulas culturales adaptadas a niños sobre festividades y tradiciones alemanas.","Recomiendo separar los ejercicios interactivos por rangos de edad (6-7 años y 8-10 años) para nivelar el ritmo de aprendizaje.","Sería genial que incluyan una lista de reproducción con las canciones del curso para que los niños puedan repasar en casa.","Sería útil contar con un glosario con pictogramas al final de cada módulo colorido para facilita el repaso semanal.","Siento que faltó un poco más de práctica oral individual durante los juegos interactivos.","Sugiero dedicar los primeros 5 minutos de cada sesión a repasar los saludos y vocabulario de la clase anterior.","Sugiero enviar una guía ilustrada en PDF al final de cada tema (saludos, colores, abecedario) para reforzar lo visto en clase.","Súper recomendable el contenido. Mi sobrino repite todas las palabras y saludos que aprende en las dinámicas de clase.","Una gran experiencia académica. Mi hija no tenía conocimientos previos y en pocas semanas ya saluda y cuenta en alemán.","Valdría la pena agregar juegos de mesa o dinámicas con tarjetas físicas para variar con el contenido en pantalla.","¡Excelente clase! A mi hijo le encantan las canciones en alemán, ya se sabe de memoria los colores y los saludos."],"r":[["2026-10-24",2,3,3,22],["2026-09-02",0,0,5,35],["2026-09-24",0,0,4,18],["2026-09-12",4,2,3,2],["2026-08-01",1,0,4,18],["2026-09-03",1,0,5,13],["2026-10-23",0,0,5,5],["2026-08-11",4,0,5,23],["2026-09-28",2,2,3,2],["2026-08-11",4,0,5,21],["2026-08-25",4,3,3,22],["2026-08-15",4,0,4,24],["2026-08-02",3,2,1,3],["2026-09-12",4,0,5,24],["2026-08-29",2,3,3,22],["2026-10-26",4,0,5,18],["2026-09-08",0,2,3,20],["2026-10-14",0,1,4,28],["2026-10-19",0,0,4,37],["2026-10-28",1,1,4,29],["2026-08-14",4,0,4,35],["2026-10-23",3,0,5,24],["2026-08-14",1,3,3,12],["2026-08-17",0,3,4,12],["2026-09-06",1,0,5,37],["2026-10-23",4,0,4,34],["2026-08-20",0,0,4,24],["2026-08-05",4,1,3,28],["2026-09-28",1,0,5,26],["2026-09-19",2,0,5,34],["2026-08-24",0,0,5,6],["2026-08-18",0,2,2,20],["2026-08-07",1,0,5,34],["2026-09-16",2,0,5,25],["2026-10-26",4,0,5,23],["2026-08-23",3,1,5,30],["2026-10-07",4,0,5,5],["2026-08-07",0,2,1,31],["2026-08-18",0,0,5,25],["2026-08-01",2,2,3,3],["2026-10-21",3,3,3,22],["2026-09-07",2,0,5,26],["2026-08-24",0,0,4,23],["2026-09-08",3,3,3,22],["2026-10-27",3,2,1,2],["2026-10-22",2,0,5,5],["2026-10-21",0,0,4,35],["2026-08-05",0,2,3,14],["2026-08-09",0,0,5,26],["2026-08-18",4,0,5,23],["2026-08-24",4,0,5,26],["2026-09-25",4,0 const S=['Vocabulario y juegos interactivos','Kinderkurs: colores, números y canciones','Módulo 1 · 6-8 años','Módulo 1 · 9-10 años','Deutsch für Kinder · Primaria'];
const K=[['Positivo','--pos'],['Feedback / Sugerencia','--sug'],['Negativo','--neg'],['Reseña General / Mixta','--mix']];
const ORD=[2,3,0,4,1],MES=['ago','sep','oct'];
// course names sorted alphabetically in data -> map to short labels by index order
const SH=D.c.map(c=>c.includes('6-8')?S[2]:c.includes('9-10')?S[3]:c.includes('Vocabulario')?S[0]:c.includes('Kinderkurs')?S[1]:S[4]);
const $=id=>document.getElementById(id),sel=$('f');
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0,fx=x=>x.toFixed(2).replace('.',',');
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
sel.innerHTML='<option value="all">Todos los cursos</option>'+SH.map((s,i)=>`<option value="${i}">${esc(s)}</option>`).join('');
let cur='all';sel.onchange=()=>{cur=sel.value;draw()};
const bar=(l,p,col,v,x='')=>`<div class="row"${x}><span>${l}</span><div class="tr"><div class="fi" style="width:${p}%;background:var(${col})"></div></div><span class="v">${v}</span></div>`;
function themes(rows,k,title,col){
 const m={};rows.filter(r=>r[2]==k).forEach(r=>m[r[4]]=(m[r[4]]||0)+1);
 const top=Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,4);
 return `<div class="card third"><h2>${title}</h2>`+(top.length?top.map(([i,n])=>`<div class="t"><span class="n" style="background:var(${col})">${n}</span><span>${esc(D.t[i])}</span></div>`).join(''):'<p class="sub">Sin comentarios en este grupo.</p>')+'</div>';
}
function draw(){
 const all=D.r,rows=all.filter(r=>cur=='all'||r[1]==cur),n=rows.length,sc=rows.map(r=>r[3]);
 const hi=sc.filter(s=>s>=4).length,lo=sc.filter(s=>s<=2).length;
 const dts=rows.map(r=>r[0]).sort();
 $('rg').textContent=n?`${n} comentarios del ${dts[0].split('-').reverse().join('/')} al ${dts[n-1].split('-').reverse().join('/')}`:'Sin datos';
 const kp=(v,l,c)=>`<div class="card kpi"><div class="big"${c?` style="color:var(${c})"`:''}>${v}</div><div class="lab">${l}</div></div>`;
 let h=kp(n,'comentarios')+kp(fx(avg(sc)),'calificación promedio (de 5)')+kp(Math.round(hi/n*100)+'%','dan 4 o 5 estrellas','--pos')+kp(lo,'dan 1 o 2 estrellas','--neg');
 h+=`<div class="card half"><h2>Cómo calificaron</h2>`+[5,4,3,2,1].map(s=>{const c=sc.filter(x=>x==s).length;return bar(s+' ★',c/n*100,s>=4?'--pos':s==3?'--sug':'--neg',c)}).join('')+'</div>';
 h+=`<div class="card half"><h2>Tipo de comentario</h2>`+K.map(([k,c],i)=>{const a=rows.filter(r=>r[2]==i);return bar(k,a.length/n*100,c,`${a.length} · ${a.length?fx(avg(a.map(r=>r[3]))):'–'}★`)}).join('')+'<p class="note">Cantidad · calificación promedio</p></div>';
 h+=`<div class="card half"><h2>Calificación por curso</h2>`+ORD.map(i=>{const a=all.filter(r=>r[1]==i).map(r=>r[3]);return `<div class="row click${cur==i?' sel':''}" tabindex="0" role="button" data-i="${i}"><span>${esc(SH[i])}</span><div class="tr"><div class="fi" style="width:${avg(a)/5*100}%;background:var(--mix)"></div></div><span class="v">${fx(avg(a))} <small>(${a.length})</small></span></div>`}).join('')+'<p class="note">Promedio sobre 5 (número de comentarios)</p></div>';
 h+=`<div class="card half"><h2>Por mes</h2>`+[7,8,9].map((m,j)=>{const a=rows.filter(r=>+r[0].slice(5,7)==m+1).map(r=>r[3]);return bar(['Agosto','Septiembre','Octubre'][j],a.length/Math.max(1,n)*100*1.6,'--mix',`${a.length} · ${a.length?fx(avg(a)):'–'}★`)}).join('')+'<p class="note">Comentarios · calificación promedio</p></div>';
 h+=themes(rows,0,'Lo que más celebran','--pos')+themes(rows,2,'Lo que preocupa','--neg')+themes(rows,1,'Lo que piden','--sug');
 $('g').innerHTML=h;
 document.querySelectorAll('.row.click').forEach(e=>{const go=()=>{cur=cur==e.dataset.i?'all':e.dataset.i;sel.value=cur;draw()};e.onclick=go;e.onkeydown=ev=>{if(ev.key=='Enter'||ev.key==' '){ev.preventDefault();go()}}});
}
draw();
</script></body></html>
